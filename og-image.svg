<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060A12"/>
      <stop offset="100%" stop-color="#0B1428"/>
    </linearGradient>
    <linearGradient id="grd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5B8EFF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="orb" cx="75%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#orb)"/>
  <!-- Grid lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/><line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="400" x2="1200" y2="400"/><line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="80" y1="0" x2="80" y2="630"/><line x1="160" y1="0" x2="160" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="320" y1="0" x2="320" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/><line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="560" y1="0" x2="560" y2="630"/><line x1="640" y1="0" x2="640" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/><line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="880" y1="0" x2="880" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/>
    <line x1="1040" y1="0" x2="1040" y2="630"/><line x1="1120" y1="0" x2="1120" y2="630"/>
  </g>
  <!-- Logo mark -->
  <circle cx="100" cy="100" r="28" fill="#2563EB" opacity="0.2"/>
  <text x="72" y="112" font-family="Arial" font-weight="900" font-size="32" fill="#2563EB">a</text>
  <!-- Logo text -->
  <text x="110" y="112" font-family="Arial" font-weight="900" font-size="28" fill="#5B8EFF">Ads</text>
  <text x="178" y="112" font-family="Arial" font-weight="900" font-size="28" fill="white">OnUs</text>
  <!-- Main headline -->
  <text x="72" y="280" font-family="Arial" font-weight="900" font-size="72" fill="white">Azərbaycanda</text>
  <text x="72" y="365" font-family="Arial" font-weight="900" font-size="72" fill="url(#grd)">#1 Reklam</text>
  <text x="72" y="450" font-family="Arial" font-weight="900" font-size="72" fill="url(#grd)">Agentliyi</text>
  <!-- Subtext -->
  <text x="72" y="520" font-family="Arial" font-weight="400" font-size="28" fill="rgba(255,255,255,0.5)">Meta · Google · TikTok · LinkedIn · SMM</text>
  <!-- CTA badge -->
  <rect x="72" y="548" width="280" height="50" rx="25" fill="#2563EB"/>
  <text x="212" y="580" font-family="Arial" font-weight="700" font-size="18" fill="white" text-anchor="middle">2 Həftə Pulsuz Sınaq</text>
  <!-- ROAS badges -->
  <rect x="820" y="200" width="300" height="80" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="835" y="235" font-family="Arial" font-size="13" fill="rgba(255,255,255,0.4)">Kosmetika Mağazası</text>
  <text x="835" y="268" font-family="Arial" font-weight="900" font-size="26" fill="#5B8EFF">×30 ROAS</text>
  <rect x="820" y="300" width="300" height="80" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="835" y="335" font-family="Arial" font-size="13" fill="rgba(255,255,255,0.4)">Geyim Mağazası</text>
  <text x="835" y="368" font-family="Arial" font-weight="900" font-size="26" fill="#5B8EFF">×12 ROAS</text>
  <rect x="820" y="400" width="300" height="80" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="835" y="435" font-family="Arial" font-size="13" fill="rgba(255,255,255,0.4)">Fitness / İdman Zalı</text>
  <text x="835" y="468" font-family="Arial" font-weight="900" font-size="26" fill="#5B8EFF">×7 ROAS</text>
